server {
    listen 80;
    server_name _;

    location = /api-server {
        return 301 /api-server/;
    }

    # strip the /api-server prefix before forwarding (proxy_pass URI replaces the matched location)
    location /api-server/ {
        proxy_pass http://continuum-api-server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /credentials-manager {
        return 301 /credentials-manager/ui/;
    }

    # strip the /credentials-manager prefix; the UI detects the prefix itself and calls the API under it
    location /credentials-manager/ {
        proxy_pass http://continuum-credentials-server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MQTT over WebSockets; no URI on proxy_pass, so /mqtt reaches mosquitto unchanged
    location /mqtt {
        proxy_pass http://mosquitto:1884;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # keep idle MQTT connections open past nginx's 60s default
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://continuum-workbench:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
