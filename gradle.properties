# Bump Gradle daemon heap so the classpath snapshot transform can handle
# the 70+ MB kotlin-compiler-embeddable jar pulled in by Spring Boot 4 (Kotlin 2.2.x).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
