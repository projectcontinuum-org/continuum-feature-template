# ============================================================
# Development overrides for continuum-feature-template
# Usage: helm install continuum-feature-template ./charts/continuum-feature-template -f charts/continuum-feature-template/values-dev.yaml -n continuum-dev --create-namespace
# ============================================================

global:
  imagePullPolicy: Always

continuum:
  secrets:
    minio:
      rootUser: "dev-minio-root"
      rootPassword: "dev-minio-secret"

  featureTemplate:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false
