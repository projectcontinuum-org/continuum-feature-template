# Kafka, MinIO, api-server and cache defaults come from continuum-worker-springboot-starter.yaml;
# only worker-specific settings live here. Every value can be overridden via the env var shown.
spring.application.name: continuum-feature-template-worker

# 8080 is taken by continuum-api-server in the local stack
server.port: ${SERVER_PORT:8090}

spring:
  temporal:
    namespace: ${TEMPORAL_NAMESPACE:default}
    connection:
      target: ${TEMPORAL_SERVER_ADDRESS:localhost:7233}
    workersAutoDiscovery:
      packages:
        - org.projectcontinuum.core.worker.starter

continuum.core:
  worker:
    # Must be unique per worker — the api-server routes node executions by this queue
    node-task-queue: ${CONTINUUM_NODE_TASK_QUEUE:CONTINUUM_FEATURE_TEMPLATE_TASK_QUEUE}

logging:
  level:
    root: error
    org.projectcontinuum.core.worker: info
    org.projectcontinuum.feature.example: debug
